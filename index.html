<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste JavaScript — Revision Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lesson-visuals.css">
<style>
:root{
  /* ---- Warm light (default) ---- */
  --bg:#f7f4ee;
  --bg-2:#efeae1;
  --panel:#fffdf9;
  --panel-2:#f2ede4;
  --line:#e3ddd1;
  --line-2:#d4ccbc;
  --ink:#2b2924;
  --ink-dim:#5c574e;
  --ink-faint:#8a8378;
  --amber:#b26a1f;
  --amber-soft:#8a5214;
  --green:#3f7d3a;
  --red:#c0392b;
  --blue:#2f6fb0;
  --purple:#7a52b3;
  --pink:#b0446a;
  /* code block surface */
  --code-bg:#2d2a26;
  --code-bar:#3a3630;
  --code-ink:#e8e3d8;
  --c-cm:#9b9488;   /* comment */
  --c-kw:#e08aa6;   /* keyword */
  --c-fn:#7fb3e0;   /* function */
  --c-st:#e0b878;   /* string */
  --c-nm:#8fc5f0;   /* number */
  --c-out:#8fce8a;  /* output */
  --c-cst:#c4a3ee;  /* constant */
  --shadow:0 1px 3px rgba(60,50,30,.08),0 4px 16px rgba(60,50,30,.05);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  /* ---- Softer dark ---- */
  --bg:#1a1d23;
  --bg-2:#15171c;
  --panel:#22262e;
  --panel-2:#2a2f38;
  --line:#31363f;
  --line-2:#3d434e;
  --ink:#dfe3ea;
  --ink-dim:#a7adba;
  --ink-faint:#767c88;
  --amber:#e8a94a;
  --amber-soft:#f2c37a;
  --green:#6cc26a;
  --red:#e5786f;
  --blue:#6ba6e8;
  --purple:#b892e8;
  --pink:#e88ba5;
  --code-bg:#14161a;
  --code-bar:#1e2127;
  --code-ink:#d6dae1;
  --c-cm:#6f7681;
  --c-kw:#e88ba5;
  --c-fn:#6ba6e8;
  --c-st:#e8c78a;
  --c-nm:#8cc3f5;
  --c-out:#7ace78;
  --c-cst:#c3a3f0;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.7;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
 
/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:296px;flex-shrink:0;
  background:var(--bg-2);
  border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;
  overflow-y:auto;
  padding:0 0 40px;
}
.main{flex:1;min-width:0;max-width:900px;margin:0 auto;padding:0 48px 120px}
 
/* ---------- Sidebar ---------- */
.brand{
  padding:26px 24px 20px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg-2);z-index:5;
}
.brand .logo{
  font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:-.3px;
  color:var(--ink);display:flex;align-items:center;gap:8px;
}
.brand .logo .blink{color:var(--amber);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.theme-toggle{
  margin-left:auto;width:30px;height:30px;border-radius:8px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--amber);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:all .18s;line-height:1;
}
.theme-toggle:hover{border-color:var(--amber);background:var(--panel);transform:rotate(15deg)}
.theme-toggle:active{transform:scale(.9)}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:.4px}
.progress-wrap{margin-top:14px}
.progress-track{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber-soft));transition:width .4s ease}
.progress-label{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:6px}
 
.nav-group{padding:16px 12px 4px}
.nav-group-title{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.2px;
  color:var(--amber);text-transform:uppercase;padding:0 12px 8px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 12px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--ink-dim);
  transition:background .15s,color .15s;
  border:none;background:none;width:100%;text-align:left;font-family:var(--sans);
}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item.active{background:var(--panel-2);color:var(--ink)}
.nav-item.active .ep-num{color:var(--amber);border-color:var(--amber)}
.ep-num{
  font-family:var(--mono);font-size:10px;font-weight:700;
  min-width:26px;height:20px;padding:0 5px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);color:var(--ink-faint);flex-shrink:0;
}
.ep-num.special{border-color:var(--purple);color:var(--purple)}
.nav-item .check{margin-left:auto;font-size:11px;color:var(--green);opacity:0;transition:opacity .2s}
.nav-item.done .check{opacity:1}
 
/* ---------- Content ---------- */
.hero{padding:56px 0 40px;border-bottom:1px solid var(--line)}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;margin-bottom:16px}
.hero h1{font-family:var(--mono);font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin-bottom:18px}
.hero h1 .accent{color:var(--amber)}
.hero p{color:var(--ink-dim);font-size:16px;max-width:600px}
.hero .stats{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}
.hero .stat{font-family:var(--mono)}
.hero .stat .n{font-size:26px;font-weight:800;color:var(--ink)}
.hero .stat .l{font-size:10.5px;color:var(--ink-faint);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
 
.episode{display:none;padding-top:44px;animation:fade .35s ease}
.episode.visible{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 
.ep-head{margin-bottom:28px}
.ep-head .tag{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:11px;font-weight:700;color:var(--amber);letter-spacing:1px;
  background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);
  padding:4px 11px;border-radius:6px;margin-bottom:16px;text-transform:uppercase;
}
.ep-head h2{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.ep-head .tldr{
  margin-top:16px;padding:14px 18px;background:var(--panel);
  border-left:3px solid var(--amber);border-radius:0 8px 8px 0;
  font-size:14.5px;color:var(--ink);
}
.ep-head .tldr b{color:var(--amber-soft)}
 
.block{margin:30px 0}
.block h3{
  font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.3px;
  margin-bottom:12px;display:flex;align-items:center;gap:9px;
}
.block h3::before{content:"▸";color:var(--amber);font-size:13px}
.block p{color:var(--ink-dim);font-size:14.5px;margin:10px 0}
.block p b,.block li b{color:var(--ink)}
.block ul{margin:10px 0 10px 4px;list-style:none}
.block ul li{color:var(--ink-dim);font-size:14.5px;padding:4px 0 4px 22px;position:relative}
.block ul li::before{content:"—";position:absolute;left:0;color:var(--amber);font-family:var(--mono)}
.kw{font-family:var(--mono);font-size:.9em;color:var(--amber-soft);background:rgba(245,166,35,.09);padding:1px 6px;border-radius:4px}
 
/* ---------- Code block ---------- */
.code{
  background:var(--code-bg);border:1px solid var(--line);border-radius:10px;
  margin:16px 0;overflow:hidden;box-shadow:var(--shadow);
}
.code-bar{
  display:flex;align-items:center;gap:7px;padding:9px 14px;
  background:var(--code-bar);border-bottom:1px solid rgba(255,255,255,.06);
}
.code-bar .dot{width:11px;height:11px;border-radius:50%}
.code-bar .dot.r{background:#ff5f56}.code-bar .dot.y{background:#ffbd2e}.code-bar .dot.g{background:#27c93f}
.code-bar .fname{font-family:var(--mono);font-size:11px;color:#9b9488;margin-left:6px}
.code pre{
  padding:16px 18px;overflow-x:auto;font-family:var(--mono);
  font-size:13px;line-height:1.75;color:var(--code-ink);tab-size:2;
}
.code pre .cm{color:var(--c-cm);font-style:italic}
.code pre .kw2{color:var(--c-kw)}
.code pre .fn{color:var(--c-fn)}
.code pre .st{color:var(--c-st)}
.code pre .nm{color:var(--c-nm)}
.code pre .out{color:var(--c-out)}
.code pre .cst{color:var(--c-cst)}
 
/* ---------- Diagram ---------- */
.diagram{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px;margin:18px 0;
}
.diagram .dtitle{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
 
/* Call stack visual */
.stack{display:flex;flex-direction:column-reverse;gap:3px;max-width:280px}
.stack .frame{
  font-family:var(--mono);font-size:12px;padding:9px 14px;border-radius:6px;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);
}
.stack .frame.gec{border-color:var(--amber);color:var(--amber-soft)}
.stack .base{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:center;padding-top:6px;border-top:1px dashed var(--line-2);margin-top:3px}
 
/* Memory / EC box */
.ec-box{display:flex;gap:14px;flex-wrap:wrap}
.ec-col{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.ec-col .head{font-family:var(--mono);font-size:11px;font-weight:700;padding:8px 12px;text-align:center;letter-spacing:.5px}
.ec-col.mem .head{background:rgba(88,166,255,.12);color:var(--blue);border-bottom:1px solid var(--line-2)}
.ec-col.code .head{background:rgba(63,185,80,.12);color:var(--green);border-bottom:1px solid var(--line-2)}
.ec-col .row{font-family:var(--mono);font-size:11.5px;padding:6px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ec-col .row:last-child{border-bottom:none}
.ec-col .row .v{color:var(--amber-soft)}
.ec-col .row .v.undef{color:var(--red)}
 
/* Event loop visual */
.loop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.loop .zone{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px}
.loop .zone .zt{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;color:var(--ink-faint)}
.loop .zone .item{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 9px;margin:4px 0;color:var(--ink)}
.loop .zone.micro{border-color:rgba(188,140,255,.4)}.loop .zone.micro .zt{color:var(--purple)}
.loop .zone.macro{border-color:rgba(245,166,35,.4)}.loop .zone.macro .zt{color:var(--amber)}
 
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px}
.flow .node{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;color:var(--ink)}
.flow .node.hl{border-color:var(--amber);color:var(--amber-soft)}
.flow .arrow{color:var(--amber)}
 
/* note callouts */
.note{border-radius:8px;padding:12px 16px;margin:16px 0;font-size:13.5px;display:flex;gap:11px;align-items:flex-start}
.note .ico{font-size:15px;line-height:1.5;flex-shrink:0}
.note.tip{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25)}
.note.tip .ico{color:var(--green)}
.note.warn{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25)}
.note.warn .ico{color:var(--red)}
.note.key{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25)}
.note.key .ico{color:var(--amber)}
.note b{color:var(--ink)}
 
/* ---------- Interview questions ---------- */
.qsec{margin:34px 0 10px}
.qsec-title{
  font-family:var(--mono);font-size:14px;font-weight:700;color:var(--amber);
  letter-spacing:.5px;padding-bottom:10px;border-bottom:1px solid var(--line);
  margin-bottom:16px;display:flex;align-items:center;gap:9px;
}
.q{
  border:1px solid var(--line);border-radius:10px;margin:10px 0;
  background:var(--panel);overflow:hidden;transition:border-color .2s;
}
.q.open{border-color:var(--line-2)}
.q-head{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;
  user-select:none;transition:background .15s;
}
.q-head:hover{background:var(--panel-2)}
.q-badge{
  font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;
  background:var(--amber);border-radius:5px;padding:2px 7px;flex-shrink:0;margin-top:2px;
}
.q-badge.hard{background:var(--red);color:#fff}
.q-badge.trick{background:var(--purple);color:#fff}
.q-text{flex:1;font-size:14.5px;font-weight:500;color:var(--ink)}
.q-toggle{font-family:var(--mono);color:var(--amber);font-size:13px;flex-shrink:0;transition:transform .25s;margin-top:1px}
.q.open .q-toggle{transform:rotate(45deg)}
.q-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.q-body-inner{padding:2px 16px 18px;border-top:1px solid var(--line);color:var(--ink-dim);font-size:14px}
.q-body-inner .code{margin-top:14px}
.q-body-inner p{margin:12px 0;color:var(--ink-dim)}
.q-body-inner b{color:var(--ink)}
.ans-label{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin-top:14px;display:block}
 
/* ---------- Footer nav ---------- */
.ep-foot{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.ep-foot button{
  font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line-2);
  color:var(--ink);padding:12px 18px;border-radius:8px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:2px;max-width:46%;
}
.ep-foot button:hover:not(:disabled){border-color:var(--amber);background:var(--panel-2)}
.ep-foot button:disabled{opacity:.3;cursor:default}
.ep-foot button .dir{font-size:9.5px;color:var(--ink-faint);letter-spacing:1px}
.ep-foot button.next{text-align:right;align-items:flex-end}
.mark-done{
  font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--green);
  color:var(--green);padding:9px 16px;border-radius:8px;cursor:pointer;margin-top:24px;transition:all .15s;
}
.mark-done:hover{background:rgba(63,185,80,.1)}
.mark-done.done{background:var(--green);color:#fff;font-weight:700}
 
/* ---------- Question Bank ---------- */
.bank-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.btab{
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--panel);border:1px solid var(--line-2);color:var(--ink-dim);
  padding:9px 14px;border-radius:8px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:8px;
}
.btab:hover{border-color:var(--amber);color:var(--ink)}
.btab.active{background:var(--panel-2);border-color:var(--amber);color:var(--amber-soft)}
.btab-n{font-size:10px;background:var(--line-2);color:var(--ink-dim);padding:1px 6px;border-radius:99px}
.btab.active .btab-n{background:var(--amber);color:#fff;font-weight:700}
.bank-sub{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0 8px}
.bank-hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:.3px}
.diff-tabs{display:flex;gap:6px}
.dtab{
  font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--line-2);
  color:var(--ink-faint);padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .15s;
}
.dtab:hover{color:var(--ink);border-color:var(--ink-faint)}
.dtab.active{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700}
.bank-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:1px;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--line)}
.q-num{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-faint);
  min-width:22px;flex-shrink:0;margin-top:3px;
}
 
/* mobile */
.menu-btn{display:none}
.overlay{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:none}
  .main{padding:0 20px 100px;max-width:100%}
  .hero h1{font-size:32px}
  .menu-btn{
    display:flex;align-items:center;gap:8px;position:fixed;top:14px;left:14px;z-index:40;
    font-family:var(--mono);font-size:12px;font-weight:700;background:var(--panel);
    border:1px solid var(--line-2);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;
  }
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
  .hero{padding-top:70px}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* Detailed lesson companions */
main a { color: var(--blue); text-underline-offset: 3px; }
[data-theme="dark"] main a { color: #93bce8; }
main a:focus-visible, summary:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }
.guide-intro, .lesson-toc, .recall { margin: 24px 0; padding: 22px; border: 1px solid var(--line); border-radius: 12px; }
.guide-intro p, .recall p { margin-top: 12px; }
.lesson-toc ol { padding-left: 22px; margin-top: 12px; }
.lesson-toc li { margin: 7px 0; }
.guide-section { margin-top: 36px; scroll-margin-top: 85px; }
.guide-section p + p { margin-top: 14px; }
.video-time { display: inline-block; font-size: 12px; margin-bottom: 14px; }
.expected-output { border-left: 3px solid var(--amber); padding: 12px 16px; margin: 14px 0; }
.expected-output pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
.recall details { padding: 15px 0; border-bottom: 1px solid var(--line); }
.recall summary { cursor: pointer; font-weight: 600; }
.guide-reference { margin: 24px 0; font-size: 13px; }
.table-scroll { overflow-x: auto; margin: 20px 0; }
.study-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.study-table th, .study-table td { text-align: left; vertical-align: top; padding: 12px; border: 1px solid var(--line); }
.study-table th { background: var(--panel-2); }
.study-table caption { text-align: left; margin-bottom: 12px; color: var(--ink-dim); }
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn">☰ Episodes</button>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">namaste_js<span class="blink">_</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme" title="Toggle theme">
          <span class="tt-icon">☀</span>
        </button>
      </div>
      <div class="sub">REVISION DECK · S1 + S2</div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        <div class="progress-label" id="progLabel">0 / 0 reviewed</div>
      </div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>

{ id:"e5", topic:"eventloop", diff:"normal",
  q:"What is the microtask queue and what goes into it vs the macrotask queue?",
  a:`<b>Microtask queue</b> (higher priority, fully drained before each macrotask): Promise callbacks <span class="kw">.then/.catch/.finally</span>, <span class="kw">queueMicrotask</span>, <span class="kw">MutationObserver</span>. <b>Macrotask / callback queue</b>: <span class="kw">setTimeout</span>, <span class="kw">setInterval</span>, DOM event callbacks, I/O. The event loop empties all microtasks, then takes one macrotask, then empties microtasks again.` },
 
{ id:"e6", topic:"eventloop", diff:"trick",
  q:"What is 'starvation' of the callback queue?",
  a:`If microtasks keep queueing <b>more microtasks</b> in an unbroken chain, the event loop never gets to the macrotask queue — so <span class="kw">setTimeout</span> callbacks and rendering can be <b>starved</b> indefinitely. A runaway promise chain can freeze timers and the UI even though the "stack" looks free.` },
 
{ id:"e7", topic:"eventloop", diff:"hard",
  q:"Two timers with the same delay — is order guaranteed?",
  setup:`<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"first"</span>), <span class="nm">100</span>);
<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"second"</span>), <span class="nm">100</span>);`,
  a:`In practice they log <b>first</b> then <b>second</b> — timers with equal delay run in registration order (FIFO in the queue). But the delay itself is a <b>minimum</b>, not exact: if the stack is busy when they're due, both are delayed and then run back-to-back once it clears.` },
 
{ id:"e8", topic:"eventloop", diff:"trick",
  q:"Why might setTimeout(fn, 5000) fire much later than 5 seconds?",
  a:`The 5000ms is a <b>minimum</b> wait. When the timer expires, the callback only enters the callback queue — the event loop then waits for the call stack to be <b>empty</b>. If a long synchronous task (e.g. a 10s loop) is running, the callback waits behind it and fires at ~10s. <b>Never block the main thread.</b>` },
 
{ id:"e9", topic:"eventloop", diff:"hard",
  q:"Predict the output.",
  setup:`<span class="kw2">async</span> <span class="kw2">function</span> <span class="fn">f</span>() {
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"1"</span>);
  <span class="kw2">await</span> <span class="fn">Promise</span>.<span class="fn">resolve</span>();
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"2"</span>);
}
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"3"</span>);
<span class="fn">f</span>();
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"4"</span>);`,
  a:`Output: <b>3, 1, 4, 2</b>. Sync: 3. <span class="kw">f()</span> runs synchronously up to <span class="kw">await</span> → logs 1, then everything after <span class="kw">await</span> is scheduled as a <b>microtask</b> and the function returns. Sync continues: 4. Then the microtask runs: 2.` },
 
{ id:"e10", topic:"eventloop", diff:"normal",
  q:"What does 'single-threaded, non-blocking' actually mean for JS?",
  a:`<b>Single-threaded:</b> one call stack, one thing at a time — no true parallelism in JS itself. <b>Non-blocking:</b> long-running operations (network, timers) are offloaded to Web APIs/OS threads; JS registers a callback and moves on. Concurrency is an illusion created by the event loop scheduling callbacks, not by extra JS threads.` },
 
{ id:"e11", topic:"eventloop", diff:"hard",
  q:"What prints, and how many event-loop ticks are involved?",
  setup:`<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"start"</span>);
<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"timeout"</span>), <span class="nm">0</span>);
<span class="fn">Promise</span>.<span class="fn">resolve</span>()
  .<span class="fn">then</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"p1"</span>))
  .<span class="fn">then</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"p2"</span>));
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"end"</span>);`,
  a:`Output: <b>start, end, p1, p2, timeout</b>. Chained <span class="kw">.then</span>s each schedule a new microtask, but the whole microtask chain (p1 → p2) drains before the single macrotask (timeout). All microtasks finish before the timer, even across multiple <span class="kw">.then</span> links.` },
 
{ id:"e12", topic:"eventloop", diff:"trick",
  q:"queueMicrotask vs setTimeout(fn, 0) — when to use which?",
  a:`<span class="kw">queueMicrotask(fn)</span> schedules <span class="kw">fn</span> as a <b>microtask</b> — runs right after the current script, before rendering and before any timer. <span class="kw">setTimeout(fn, 0)</span> schedules a <b>macrotask</b> — runs after microtasks and possibly after a render. Use microtasks to finish work "as soon as possible without blocking"; use timers to yield to rendering/other tasks.` },
 
{ id:"e13", topic:"eventloop", diff:"hard",
  q:"Why does this freeze the page for 3 seconds?",
  setup:`<span class="kw2">const</span> start = <span class="fn">Date</span>.<span class="fn">now</span>();
<span class="kw2">while</span> (<span class="fn">Date</span>.<span class="fn">now</span>() - start < <span class="nm">3000</span>) {}
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"done"</span>);`,
  a:`The <span class="kw">while</span> loop is synchronous and monopolizes the single call stack for 3 seconds. Nothing else can run — no clicks, no rendering, no timers — because the event loop can't push anything until the stack clears. This is the canonical "blocking the main thread" anti-pattern.` },
 
{ id:"e14", topic:"eventloop", diff:"normal",
  q:"When exactly does the event loop move a callback onto the call stack?",
  a:`Only when the <b>call stack is empty</b>. On each tick, the loop checks: is the stack empty? If yes, it first drains the <b>entire microtask queue</b>, then takes <b>one</b> task from the macrotask queue and runs it. Rendering opportunities happen between macrotasks. It never interrupts running code mid-function.` },
 
{ id:"e15", topic:"eventloop", diff:"hard",
  q:"Order these: sync log, setTimeout, Promise.then, and an async IIFE awaiting null.",
  setup:`<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"sync"</span>);
<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"timeout"</span>), <span class="nm">0</span>);
<span class="fn">Promise</span>.<span class="fn">resolve</span>().<span class="fn">then</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"promise"</span>));
(<span class="kw2">async</span> () => {
  <span class="kw2">await</span> <span class="kw2">null</span>;
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"async-after-await"</span>);
})();`,
  a:`Output: <b>sync, promise, async-after-await, timeout</b>. Sync runs first. Both the <span class="kw">.then</span> and the code after <span class="kw">await null</span> are microtasks (queued in that order), draining before the timer macrotask. So promise → async-after-await → timeout.` },
 
/* ---------------- PROMISES & ASYNC/AWAIT (15) ---------------- */
{ id:"p1", topic:"promises", diff:"normal",
  q:"What are the three states of a Promise, and what does 'immutable once settled' mean?",
  a:`States: <b>pending</b> (initial), <b>fulfilled</b> (resolved with a value), <b>rejected</b> (failed with a reason). A promise settles <b>at most once</b>; it may stay pending forever. Once fulfilled or rejected, its outcome is fixed. A fulfilled object is not frozen. Resolving with a pending promise can lock in its eventual outcome while leaving this promise pending.` },
 
{ id:"p2", topic:"promises", diff:"hard",
  q:"What's the output?",
  setup:`<span class="fn">Promise</span>.<span class="fn">resolve</span>(<span class="nm">1</span>)
  .<span class="fn">then</span>((x) => x + <span class="nm">1</span>)
  .<span class="fn">then</span>((x) => { <span class="kw2">throw</span> <span class="kw2">new</span> <span class="fn">Error</span>(<span class="st">"boom"</span>); })
  .<span class="fn">catch</span>(() => <span class="nm">10</span>)
  .<span class="fn">then</span>((x) => <span class="fn">console</span>.<span class="fn">log</span>(x));`,
  a:`Prints <b>10</b>. Flow: 1 → +1 = 2 → throws → skips to <span class="kw">.catch</span> (returns 10) → final <span class="kw">.then</span> receives 10. A <span class="kw">.catch</span> "recovers," and whatever it returns flows to the next <span class="kw">.then</span>.` },
 
{ id:"p3", topic:"promises", diff:"normal",
  q:"Difference between Promise.all and Promise.allSettled when one rejects?",
  a:`<b>Promise.all fails fast</b> — the instant any promise rejects, the whole thing rejects with that error and the other results are discarded. <b>Promise.allSettled collects input rejections</b> (invalid input, such as a non-iterable, can still reject) — it waits for every promise to settle and returns an array of <span class="kw">{status, value|reason}</span> so you see all outcomes.` },
 
{ id:"p4", topic:"promises", diff:"trick",
  q:"race vs any — what's the difference on rejection?",
  a:`<b>Promise.race</b> settles with the <b>first to settle</b> — if the fastest one <b>rejects</b>, race rejects. <b>Promise.any</b> ignores rejections and settles with the <b>first to fulfill</b>; it only rejects if <b>all</b> reject (with an <span class="kw">AggregateError</span>, whose <span class="kw">.errors</span> holds all reasons). Mnemonic: race = first across the line dead or alive; any = first winner.` },
 
{ id:"p5", topic:"promises", diff:"hard",
  q:"Does await block the main thread? Explain what actually happens.",
  a:`<b>No.</b> On <span class="kw">await</span> of an unsettled promise, the async function is <b>suspended and popped off the call stack</b>, freeing the thread to run everything else. When the promise settles, the continuation is queued as a <b>microtask</b> and the function resumes from that exact line. The engine never sits idle "waiting."` },
 
{ id:"p6", topic:"promises", diff:"normal",
  q:"What does an async function return if you return a plain string?",
  setup:`<span class="kw2">async</span> <span class="kw2">function</span> <span class="fn">f</span>() { <span class="kw2">return</span> <span class="st">"hi"</span>; }
<span class="kw2">const</span> r = <span class="fn">f</span>();`,
  a:`<span class="kw">r</span> is a <b>Promise</b> resolved with <span class="st">"hi"</span> — an async function <b>always</b> returns a promise, auto-wrapping non-promise return values. Extract it with <span class="kw">r.then(v => ...)</span> or <span class="kw">await f()</span>. Returning a promise makes the async function’s distinct returned promise adopt its eventual outcome; they are not the same object.` },
 
{ id:"p7", topic:"promises", diff:"hard",
  q:"Sequential vs parallel awaits — what's slow here and how do you fix it?",
  setup:`<span class="kw2">const</span> a = <span class="kw2">await</span> <span class="fn">fetchA</span>();  <span class="cm">// 2s</span>
<span class="kw2">const</span> b = <span class="kw2">await</span> <span class="fn">fetchB</span>();  <span class="cm">// 2s</span>
<span class="cm">// total ~4s</span>`,
  a:`They run <b>sequentially</b> — b doesn't start until a finishes (~4s total). If independent, start both first, then await:`,
  fix:`<span class="kw2">const</span> [a, b] = <span class="kw2">await</span> <span class="fn">Promise</span>.<span class="fn">all</span>([<span class="fn">fetchA</span>(), <span class="fn">fetchB</span>()]);
<span class="cm">// both run concurrently → ~2s total ✅</span>` },
 
{ id:"p8", topic:"promises", diff:"trick",
  q:"Why is forgetting `return` inside .then a common bug?",
  setup:`<span class="fn">createOrder</span>(cart)
  .<span class="fn">then</span>((id) => { <span class="fn">proceedToPayment</span>(id); })   <span class="cm">// no return!</span>
  .<span class="fn">then</span>((payment) => <span class="fn">console</span>.<span class="fn">log</span>(payment));`,
  a:`The second <span class="kw">.then</span> gets <b>undefined</b>, not the payment result — because the first <span class="kw">.then</span> didn't <span class="kw">return</span> the promise/value. Always return the value or promise you want to flow down the chain. (Arrow with implicit return, or explicit <span class="kw">return</span>.)` },
 
{ id:"p9", topic:"promises", diff:"hard",
  q:"Convert this callback API into a promise (promisify).",
  setup:`<span class="cm">// node-style: cb(err, data)</span>
<span class="fn">readFile</span>(path, (err, data) => { ... });`,
  a:`Wrap it in a new Promise, resolving on success and rejecting on error:`,
  fix:`<span class="kw2">function</span> <span class="fn">readFileP</span>(path) {
  <span class="kw2">return</span> <span class="kw2">new</span> <span class="fn">Promise</span>((resolve, reject) => {
    <span class="fn">readFile</span>(path, (err, data) => {
      <span class="kw2">if</span> (err) <span class="fn">reject</span>(err);
      <span class="kw2">else</span> <span class="fn">resolve</span>(data);
    });
  });
}` },
 
{ id:"p10", topic:"promises", diff:"normal",
  q:"How do you handle errors with async/await vs .then?",
  a:`With <b>async/await</b>, use <span class="kw">try...catch</span> around the awaited calls — reads like synchronous error handling. With <b>.then</b> chains, attach a single <span class="kw">.catch</span> at the end (errors bubble down to the nearest catch). You can also mix: <span class="kw">await somePromise.catch(...)</span>. For fire-and-forget async functions, add a <span class="kw">.catch</span> on the returned promise so rejections aren't unhandled.` },
 
{ id:"p11", topic:"promises", diff:"hard",
  q:"What's the output order?",
  setup:`<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"1"</span>);
<span class="kw2">const</span> p = <span class="kw2">new</span> <span class="fn">Promise</span>((res) => {
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"2"</span>);
  <span class="fn">res</span>();
});
p.<span class="fn">then</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"3"</span>));
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"4"</span>);`,
  a:`Output: <b>1, 2, 4, 3</b>. The Promise <b>executor runs synchronously</b> the moment you construct it — so "2" logs immediately. But <span class="kw">.then</span> callbacks are always microtasks, so "3" runs after the synchronous "4".` },
 
{ id:"p12", topic:"promises", diff:"trick",
  q:"What does Promise.all([]) (empty array) resolve to?",
  a:`It is already fulfilled with an empty array <span class="kw">[]</span>. Similarly <span class="kw">Promise.allSettled([])</span> → <span class="kw">[]</span>. But <span class="kw">Promise.any([])</span> <b>rejects</b> with an <span class="kw">AggregateError</span> ("All promises were rejected") since there's nothing to fulfill, and <span class="kw">Promise.race([])</span> stays <b>pending forever</b>. Handlers attached to an already-settled promise still run asynchronously.` },
 
{ id:"p13", topic:"promises", diff:"hard",
  q:"Implement Promise.all-like aggregation for a dense array.",
  a:`Track results by index and a completion count; resolve when all done, reject on first error. This dense-array exercise is not a complete iterable-compatible polyfill:`,
  fix:`<span class="kw2">function</span> <span class="fn">allP</span>(promises) {
  <span class="kw2">return</span> <span class="kw2">new</span> <span class="fn">Promise</span>((resolve, reject) => {
    <span class="kw2">const</span> res = []; <span class="kw2">let</span> done = <span class="nm">0</span>;
    <span class="kw2">if</span> (!promises.length) <span class="kw2">return</span> <span class="fn">resolve</span>([]);
    promises.<span class="fn">forEach</span>((p, i) => {
      <span class="fn">Promise</span>.<span class="fn">resolve</span>(p).<span class="fn">then</span>((v) => {
        res[i] = v;
        <span class="kw2">if</span> (++done === promises.length) <span class="fn">resolve</span>(res);
      }, reject);   <span class="cm">// first rejection kills it</span>
    });
  });
}` },
 
{ id:"p14", topic:"promises", diff:"normal",
  q:"What problems do Promises solve compared to callbacks?",
  a:`Two big ones. <b>Callback hell</b> — nested callbacks form a sideways "pyramid of doom"; promise <b>chaining</b> flattens this vertically. <b>Inversion of control</b> — with callbacks you hand your critical logic to another function and blindly trust it to call back correctly (once, on time, on error); with promises <b>you</b> attach handlers to a returned object, keeping control on your side.` },
 
{ id:"p15", topic:"promises", diff:"hard",
  q:"What's logged and when? (mixing await with a rejected promise)",
  setup:`<span class="kw2">async</span> <span class="kw2">function</span> <span class="fn">run</span>() {
  <span class="kw2">try</span> {
    <span class="kw2">await</span> <span class="fn">Promise</span>.<span class="fn">reject</span>(<span class="kw2">new</span> <span class="fn">Error</span>(<span class="st">"x"</span>));
    <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"after"</span>);
  } <span class="kw2">catch</span> (e) {
    <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"caught:"</span>, e.message);
  }
}
<span class="fn">run</span>();`,
  a:`Prints <b>caught: x</b>. Awaiting a rejected promise <b>throws</b> at the await point, so <span class="kw">"after"</span> is skipped and control jumps to <span class="kw">catch</span>. This is the async/await equivalent of a rejected <span class="kw">.then</span> routing to <span class="kw">.catch</span>.` },
 
/* ---------------- this / call·bind·apply (15) ---------------- */
{ id:"t1", topic:"this", diff:"normal",
  q:"What is `this` at the global level, in a regular function, and in an object method?",
  a:`<b>Browser classic-script top level (modules use undefined):</b> the global object (<span class="kw">window</span> in browsers, <span class="kw">globalThis</span> generally). <b>Regular function call:</b> <span class="kw">undefined</span> in strict mode, the global object in non-strict ("this substitution"). <b>Object method:</b> the object that called it (left of the dot). Rule: for regular functions, <span class="kw">this</span> is decided by <b>how it's called</b>, not where it's defined.` },
 
{ id:"t2", topic:"this", diff:"hard",
  q:"In a browser classic script with no global val property, why does obj.b() return undefined?",
  setup:`<span class="kw2">const</span> obj = {
  val: <span class="nm">42</span>,
  a: <span class="kw2">function</span>() { <span class="kw2">return</span> <span class="kw2">this</span>.val; },
  b: () => <span class="kw2">this</span>.val,
};
<span class="fn">console</span>.<span class="fn">log</span>(obj.<span class="fn">a</span>(), obj.<span class="fn">b</span>());`,
  a:`Prints <b>42 undefined</b>. <span class="kw">obj.a()</span> is a regular method → <span class="kw">this</span> is <span class="kw">obj</span>. <span class="kw">obj.b</span> is an <b>arrow function</b> — it has no own <span class="kw">this</span>, so it uses the lexical/global <span class="kw">this</span>, where <span class="kw">val</span> doesn't exist. Use a regular function when a method needs its call-site receiver. In a module this arrow would capture undefined, so reading this.val would throw.` },
 
{ id:"t3", topic:"this", diff:"normal",
  q:"call vs apply vs bind — what's the difference?",
  a:`For ordinary unbound functions, all three let you supply <span class="kw">this</span>. They cannot replace an arrow’s lexical this. <b>call(ctx, a, b)</b> invokes immediately, args listed. <b>apply(ctx, [a, b])</b> invokes immediately, args as an array. <b>bind(ctx, a)</b> does <b>not</b> invoke — it returns a <b>new function</b> with <span class="kw">this</span> (and optional preset args) remembered for later ordinary calls. Constructor calls with new have separate receiver rules.` },
 
{ id:"t4", topic:"this", diff:"hard",
  q:"Fix the lost `this` in this callback.",
  setup:`<span class="kw2">const</span> user = {
  name: <span class="st">"Alok"</span>,
  greetLater() {
    <span class="fn">setTimeout</span>(<span class="kw2">function</span>() {
      <span class="fn">console</span>.<span class="fn">log</span>(<span class="kw2">this</span>.name);  <span class="cm">// not user.name; depends on the timer host</span>
    }, <span class="nm">100</span>);
  },
};`,
  a:`Inside a regular <span class="kw">setTimeout</span> callback, <span class="kw">this</span> isn't <span class="kw">user</span>. Use an <b>arrow function</b> so it inherits the method's <span class="kw">this</span>:`,
  fix:`greetLater() {
  <span class="fn">setTimeout</span>(() => {
    <span class="fn">console</span>.<span class="fn">log</span>(<span class="kw2">this</span>.name);  <span class="cm">// "Alok" ✅ lexical this</span>
  }, <span class="nm">100</span>);
}
<span class="cm">// (pre-arrow: const self = this;  OR  .bind(this))</span>` },
 
{ id:"t5", topic:"this", diff:"hard",
  q:"Borrow a method from one object for another using call.",
  setup:`<span class="kw2">const</span> person = { fullName() { <span class="kw2">return</span> <span class="kw2">this</span>.first + <span class="st">" "</span> + <span class="kw2">this</span>.last; } };
<span class="kw2">const</span> a = { first: <span class="st">"John"</span>, last: <span class="st">"Doe"</span> };`,
  a:`Use <span class="kw">call</span> (or <span class="kw">apply</span>) to run <span class="kw">person</span>'s method with <span class="kw">a</span> as <span class="kw">this</span>:`,
  fix:`person.<span class="fn">fullName</span>.<span class="fn">call</span>(a);   <span class="cm">// "John Doe"</span>
<span class="cm">// method borrowing — reuse without duplicating code</span>` },
 
{ id:"t6", topic:"this", diff:"trick",
  q:"What does `this` refer to when a method is assigned to a variable and called?",
  setup:`<span class="kw2">const</span> obj = { x: <span class="nm">1</span>, get() { <span class="kw2">return</span> <span class="kw2">this</span>.x; } };
<span class="kw2">const</span> fn = obj.<span class="fn">get</span>;
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">fn</span>());`,
  a:`In a non-strict script it reads the global x property (undefined if absent); in strict mode it throws a TypeError. Detaching the method loses the <span class="kw">obj</span> binding — <span class="kw">fn()</span> is a plain function call, so <span class="kw">this</span> is <span class="kw">undefined</span>/global, not <span class="kw">obj</span>. Fix: <span class="kw">const fn = obj.get.bind(obj)</span>.` },
 
{ id:"t7", topic:"this", diff:"normal",
  q:"How do arrow functions determine `this`?",
  a:`Arrow functions have <b>no own <span class="kw">this</span></b>. They capture <span class="kw">this</span> <b>lexically</b> — from the scope where they're <b>defined</b>, decided at definition time, not call time. This makes them ideal for callbacks inside methods (they keep the surrounding <span class="kw">this</span>) but unsuitable when a method needs a dynamic receiver. Arrows cannot be constructors.` },
 
{ id:"t8", topic:"this", diff:"hard",
  q:"Implement a simple bind-like helper for ordinary calls.",
  a:`Return a new function that applies the original with a fixed context and merged args. This teaching implementation does not reproduce native bound-constructor or metadata behavior:`,
  fix:`<span class="fn">Function</span>.prototype.myBind = <span class="kw2">function</span>(ctx, ...preset) {
  <span class="kw2">const</span> fn = <span class="kw2">this</span>;
  <span class="kw2">return</span> <span class="kw2">function</span>(...later) {
    <span class="kw2">return</span> fn.<span class="fn">apply</span>(ctx, [...preset, ...later]);
  };
};` },
 
{ id:"t9", topic:"this", diff:"trick",
  q:"What is `this` inside a constructor called with `new`?",
  setup:`<span class="kw2">function</span> <span class="fn">Person</span>(name) { <span class="kw2">this</span>.name = name; }
<span class="kw2">const</span> p = <span class="kw2">new</span> <span class="fn">Person</span>(<span class="st">"Ada"</span>);`,
  a:`With <span class="kw">new</span>, JS creates a fresh empty object and binds <span class="kw">this</span> to it, runs the constructor, and returns that object (unless the constructor returns its own object). So <span class="kw">this</span> is the <b>new instance</b> — <span class="kw">p.name === "Ada"</span>. This is why arrow functions can't be constructors: they have no own <span class="kw">this</span>.` },
 
{ id:"t10", topic:"this", diff:"hard",
  q:"Predict the output — regular forEach callback in a non-strict browser script with no global tag property.",
  setup:`<span class="kw2">const</span> obj = {
  vals: [<span class="nm">1</span>, <span class="nm">2</span>],
  tag: <span class="st">"X"</span>,
  run() {
    <span class="kw2">this</span>.vals.<span class="fn">forEach</span>(<span class="kw2">function</span>(v) {
      <span class="fn">console</span>.<span class="fn">log</span>(<span class="kw2">this</span>.tag, v);
    });
  },
};
obj.<span class="fn">run</span>();`,
  a:`Logs <b>undefined 1</b> and <b>undefined 2</b>. The <span class="kw">forEach</span> callback is a <b>regular function</b>, so its <span class="kw">this</span> isn't <span class="kw">obj</span>. Fix by using an arrow callback (inherits <span class="kw">this</span>) or passing <span class="kw">obj</span> as forEach's second <span class="kw">thisArg</span>.` },
 
{ id:"t11", topic:"this", diff:"normal",
  q:"How can you set `this` for a forEach/map callback without an arrow?",
  a:`Array methods like <span class="kw">forEach</span>, <span class="kw">map</span>, <span class="kw">filter</span> accept a second <b>thisArg</b> parameter:`,
  fix:`arr.<span class="fn">forEach</span>(<span class="kw2">function</span>(v) {
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="kw2">this</span>.tag, v);
}, obj);   <span class="cm">// obj becomes the callback's this</span>` },
 
{ id:"t12", topic:"this", diff:"trick",
  q:"Does bind-ing an already-bound function change its `this`?",
  setup:`<span class="kw2">function</span> <span class="fn">f</span>() { <span class="kw2">return</span> <span class="kw2">this</span>.x; }
<span class="kw2">const</span> g = f.<span class="fn">bind</span>({ x: <span class="nm">1</span> });
<span class="kw2">const</span> h = g.<span class="fn">bind</span>({ x: <span class="nm">2</span> });
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">h</span>());`,
  a:`Prints <b>1</b>. A bound function's <span class="kw">this</span> is <b>permanent</b> — the second <span class="kw">bind</span> (and even <span class="kw">call</span>/<span class="kw">apply</span>) can't override it. The first binding to <span class="kw">{x:1}</span> wins.` },
 
{ id:"t13", topic:"this", diff:"hard",
  q:"Implement a simple bind using apply and closures (with partial args).",
  a:`Same idea as the polyfill — capture context and preset args in a closure:`,
  fix:`<span class="kw2">const</span> bind = (fn, ctx, ...preset) =>
  (...rest) => fn.<span class="fn">apply</span>(ctx, [...preset, ...rest]);
 
<span class="kw2">const</span> add = (a, b) => a + b;
<span class="kw2">const</span> add5 = <span class="fn">bind</span>(add, <span class="kw2">null</span>, <span class="nm">5</span>);
<span class="fn">add5</span>(<span class="nm">10</span>);   <span class="cm">// 15</span>` },
 
{ id:"t14", topic:"this", diff:"normal",
  q:"In strict mode, what is `this` in a standalone function call?",
  a:`<b><span class="kw">undefined</span></b>. Strict mode disables "this substitution," so a plain function call (not a method, not <span class="kw">new</span>, not bound) leaves <span class="kw">this</span> as <span class="kw">undefined</span> rather than defaulting to the global object. Accessing <span class="kw">this.something</span> then throws a TypeError — which is safer and catches accidental global leaks.` },
 
{ id:"t15", topic:"this", diff:"hard",
  q:"Predict the output across call, apply, and a bound copy.",
  setup:`<span class="kw2">function</span> <span class="fn">who</span>(greet) { <span class="kw2">return</span> greet + <span class="st">" "</span> + <span class="kw2">this</span>.name; }
<span class="kw2">const</span> u = { name: <span class="st">"Sam"</span> };
<span class="fn">console</span>.<span class="fn">log</span>(who.<span class="fn">call</span>(u, <span class="st">"Hi"</span>));
<span class="fn">console</span>.<span class="fn">log</span>(who.<span class="fn">apply</span>(u, [<span class="st">"Hey"</span>]));
<span class="kw2">const</span> b = who.<span class="fn">bind</span>(u, <span class="st">"Yo"</span>);
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">b</span>());`,
  a:`Prints <b>"Hi Sam"</b>, <b>"Hey Sam"</b>, <b>"Yo Sam"</b>. <span class="kw">call</span> passes the arg directly; <span class="kw">apply</span> passes it in an array; <span class="kw">bind</span> presets the arg and <span class="kw">this</span>, returning a function you invoke later. All three route <span class="kw">this</span> to <span class="kw">u</span>.` },
 
/* ---------------- map · filter · reduce (15) ---------------- */
{ id:"m1", topic:"mapreduce", diff:"normal",
  q:"What does each of map, filter, and reduce return?",
  a:`<b>map</b> → a <b>new array</b> of the same length, each element transformed. <b>filter</b> → a <b>new array</b> (same-or-shorter) with only elements where the callback is truthy. <b>reduce</b> → a <b>single accumulated value</b> (number, string, object, array — anything). Mnemonic: map = same size/new shape, filter = fewer/same shape, reduce = anything → one thing.` },
 
{ id:"m2", topic:"mapreduce", diff:"normal",
  q:"Double each number, then keep only those > 5.",
  setup:`<span class="kw2">const</span> arr = [<span class="nm">1</span>, <span class="nm">2</span>, <span class="nm">3</span>, <span class="nm">4</span>];`,
  a:`Chain map then filter (both return arrays):`,
  fix:`arr.<span class="fn">map</span>((x) => x * <span class="nm">2</span>)
   .<span class="fn">filter</span>((x) => x > <span class="nm">5</span>);
<span class="cm">// [6, 8]</span>` },
 
{ id:"m3", topic:"mapreduce", diff:"normal",
  q:"Sum an array using reduce.",
  setup:`<span class="kw2">const</span> arr = [<span class="nm">5</span>, <span class="nm">1</span>, <span class="nm">3</span>, <span class="nm">2</span>];`,
  a:`Accumulate from an initial value of 0:`,
  fix:`arr.<span class="fn">reduce</span>((acc, curr) => acc + curr, <span class="nm">0</span>);
<span class="cm">// 11</span>` },
 
{ id:"m4", topic:"mapreduce", diff:"hard",
  q:"Implement map() using reduce().",
  a:`reduce into a new array, pushing each transformed element:`,
  fix:`<span class="fn">Array</span>.prototype.myMap = <span class="kw2">function</span>(cb) {
  <span class="kw2">return</span> <span class="kw2">this</span>.<span class="fn">reduce</span>((acc, curr, i, arr) => {
    acc.<span class="fn">push</span>(<span class="fn">cb</span>(curr, i, arr));
    <span class="kw2">return</span> acc;
  }, []);
};
[<span class="nm">1</span>,<span class="nm">2</span>,<span class="nm">3</span>].<span class="fn">myMap</span>((x) => x * <span class="nm">2</span>);  <span class="cm">// [2, 4, 6]</span>` },
 
{ id:"m5", topic:"mapreduce", diff:"hard",
  q:"Count occurrences of each item using reduce.",
  setup:`<span class="kw2">const</span> names = [<span class="st">"a"</span>, <span class="st">"b"</span>, <span class="st">"a"</span>, <span class="st">"c"</span>, <span class="st">"b"</span>, <span class="st">"a"</span>];`,
  a:`Build a frequency object accumulator:`,
  fix:`names.<span class="fn">reduce</span>((acc, n) => {
  acc[n] = (acc[n] || <span class="nm">0</span>) + <span class="nm">1</span>;
  <span class="kw2">return</span> acc;
}, {});
<span class="cm">// { a: 3, b: 2, c: 1 }</span>` },
 
{ id:"m6", topic:"mapreduce", diff:"normal",
  q:"When should you use map vs forEach?",
  a:`<b>map</b> returns a new transformed array — use it when you need the result. <b>forEach</b> returns <span class="kw">undefined</span> — use it only for <b>side effects</b> (logging, mutating something external). Calling <span class="kw">map</span> and ignoring the return value is a code smell; reach for <span class="kw">forEach</span> there. Also, neither should be used where you'd want to break early — use a <span class="kw">for</span> loop or <span class="kw">some</span>/<span class="kw">find</span>.` },
 
{ id:"m7", topic:"mapreduce", diff:"trick",
  q:"Classic gotcha: what does this produce?",
  setup:`[<span class="st">"1"</span>, <span class="st">"2"</span>, <span class="st">"3"</span>].<span class="fn">map</span>(<span class="fn">parseInt</span>);`,
  a:`<b>[1, NaN, NaN]</b>. <span class="kw">map</span> passes <b>three</b> args (value, index, array), and <span class="kw">parseInt</span> takes (string, radix). So it calls <span class="kw">parseInt("1",0)</span>=1, <span class="kw">parseInt("2",1)</span>=NaN, <span class="kw">parseInt("3",2)</span>=NaN. Fix: <span class="kw">.map(Number)</span> or <span class="kw">.map((x) => parseInt(x, 10))</span>.` },
 
{ id:"m8", topic:"mapreduce", diff:"hard",
  q:"Get first names of all users under 30 (filter + map, and again with reduce).",
  setup:`<span class="kw2">const</span> users = [
  { name: <span class="st">"Alok"</span>, age: <span class="nm">23</span> },
  { name: <span class="st">"Ashish"</span>, age: <span class="nm">29</span> },
  { name: <span class="st">"Ankit"</span>, age: <span class="nm">45</span> },
];`,
  a:`Chain, or do it in one pass with reduce:`,
  fix:`<span class="cm">// filter + map</span>
users.<span class="fn">filter</span>((u) => u.age < <span class="nm">30</span>).<span class="fn">map</span>((u) => u.name);
 
<span class="cm">// single-pass reduce</span>
users.<span class="fn">reduce</span>((acc, u) => {
  <span class="kw2">if</span> (u.age < <span class="nm">30</span>) acc.<span class="fn">push</span>(u.name);
  <span class="kw2">return</span> acc;
}, []);
<span class="cm">// ["Alok", "Ashish"]</span>` },
 
{ id:"m9", topic:"mapreduce", diff:"hard",
  q:"Flatten a 2D array using reduce.",
  setup:`<span class="kw2">const</span> arr = [[<span class="nm">1</span>, <span class="nm">2</span>], [<span class="nm">3</span>, <span class="nm">4</span>], [<span class="nm">5</span>]];`,
  a:`Concatenate each sub-array into the accumulator:`,
  fix:`arr.<span class="fn">reduce</span>((acc, cur) => acc.<span class="fn">concat</span>(cur), []);
<span class="cm">// [1, 2, 3, 4, 5]   (or just arr.flat())</span>` },
 
{ id:"m10", topic:"mapreduce", diff:"hard",
  q:"Implement filter() using reduce().",
  a:`Push only elements passing the predicate:`,
  fix:`<span class="fn">Array</span>.prototype.myFilter = <span class="kw2">function</span>(cb) {
  <span class="kw2">return</span> <span class="kw2">this</span>.<span class="fn">reduce</span>((acc, cur, i, arr) => {
    <span class="kw2">if</span> (<span class="fn">cb</span>(cur, i, arr)) acc.<span class="fn">push</span>(cur);
    <span class="kw2">return</span> acc;
  }, []);
};` },
 
{ id:"m11", topic:"mapreduce", diff:"trick",
  q:"Why does reduce throw here, and how do you fix it?",
  setup:`[].<span class="fn">reduce</span>((a, b) => a + b);  <span class="cm">// 💥</span>`,
  a:`<b>TypeError: Reduce of empty array with no initial value.</b> Without an initial accumulator, reduce uses the first element as the seed — but an empty array has none. <b>Fix:</b> always pass an initial value: <span class="kw">[].reduce((a, b) => a + b, 0)</span> → <span class="kw">0</span>.` },
 
{ id:"m12", topic:"mapreduce", diff:"normal",
  q:"Find the maximum value using reduce.",
  setup:`<span class="kw2">const</span> arr = [<span class="nm">5</span>, <span class="nm">1</span>, <span class="nm">9</span>, <span class="nm">3</span>];`,
  a:`Seed with the first element (or -Infinity):`,
  fix:`arr.<span class="fn">reduce</span>((max, cur) => (cur > max ? cur : max), -<span class="fn">Infinity</span>);
<span class="cm">// 9</span>` },
 
{ id:"m13", topic:"mapreduce", diff:"hard",
  q:"Group an array of objects by a key (groupBy) with reduce.",
  setup:`<span class="kw2">const</span> people = [
  { name: <span class="st">"A"</span>, city: <span class="st">"BLR"</span> },
  { name: <span class="st">"B"</span>, city: <span class="st">"DEL"</span> },
  { name: <span class="st">"C"</span>, city: <span class="st">"BLR"</span> },
];`,
  a:`Accumulate into an object of arrays keyed by city:`,
  fix:`people.<span class="fn">reduce</span>((acc, p) => {
  (acc[p.city] ||= []).<span class="fn">push</span>(p.name);
  <span class="kw2">return</span> acc;
}, {});
<span class="cm">// { BLR: ["A", "C"], DEL: ["B"] }</span>` },
 
{ id:"m14", topic:"mapreduce", diff:"trick",
  q:"map vs filter — what does a truthy/falsy return do in each?",
  a:`In <b>filter</b>, the callback's return is coerced to boolean — truthy <b>keeps</b> the element, falsy <b>drops</b> it. In <b>map</b>, the return <b>becomes</b> the new element regardless of truthiness — returning <span class="kw">true</span>/<span class="kw">false</span> from a map callback literally puts booleans in the output array. So <span class="kw">[1,2,3].map(x => x > 1)</span> → <span class="kw">[false, true, true]</span>, but <span class="kw">.filter(x => x > 1)</span> → <span class="kw">[2, 3]</span>.` },
 
{ id:"m15", topic:"mapreduce", diff:"hard",
  q:"Chain map, filter, reduce: total price of in-stock items after a 10% discount.",
  setup:`<span class="kw2">const</span> items = [
  { price: <span class="nm">100</span>, inStock: <span class="kw2">true</span> },
  { price: <span class="nm">50</span>,  inStock: <span class="kw2">false</span> },
  { price: <span class="nm">200</span>, inStock: <span class="kw2">true</span> },
];`,
  a:`Filter in-stock → map to discounted price → reduce to a sum:`,
  fix:`items
  .<span class="fn">filter</span>((i) => i.inStock)
  .<span class="fn">map</span>((i) => i.price * <span class="nm">0.9</span>)
  .<span class="fn">reduce</span>((sum, p) => sum + p, <span class="nm">0</span>);
<span class="cm">// 270   (90 + 180)</span>` },
];

<script>
/* ============================================================
   Namaste JavaScript Revision Deck — app engine
   Renders CONTENT + QUESTIONS, handles nav, progress, mobile.
   State kept in memory only (no browser storage).
   ============================================================ */
(function () {
  "use strict";
 
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const progFill = document.getElementById("progFill");
  const progLabel = document.getElementById("progLabel");
  const sidebar = document.getElementById("sidebar");
  const menuBtn = document.getElementById("menuBtn");
  const overlay = document.getElementById("overlay");
 
  const done = new Set();          // reviewed episode ids
  let current = "home";
 
  /* ---------- block renderers ---------- */
  function renderCode(b) {
    return `<div class="code">
      <div class="code-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fname">${b.f || "script.js"}</span></div>
      <pre>${b.c}</pre></div>`;
  }
 
  function renderDiagram(b) {
    let inner = "";
    if (b.kind === "ecbox") {
      inner = `<div class="ec-box">
        <div class="ec-col mem"><div class="head">MEMORY (Variable Env)</div>
          ${b.mem.map(r => `<div class="row"><span>${r[0]}</span><span class="v${/undefined|TDZ|never|—/.test(r[1]) ? " undef" : ""}">${r[1]}</span></div>`).join("")}
        </div>
        <div class="ec-col code"><div class="head">CODE (Thread)</div>
          ${b.code.map(r => `<div class="row"><span>${r[0]}</span><span class="v">${r[1] || ""}</span></div>`).join("")}
        </div>
      </div>`;
    } else if (b.kind === "stack") {
      inner = `<div class="stack">
        ${b.frames.map(f => `<div class="frame ${f[0]}">${f[1]}</div>`).join("")}
        <div class="base">— stack base —</div>
      </div>`;
    } else if (b.kind === "loop") {
      inner = `<div class="loop">
        <div class="zone micro"><div class="zt">Microtask Queue · high priority</div>
          ${b.micro.map(i => `<div class="item">${i}</div>`).join("")}</div>
        <div class="zone macro"><div class="zt">Callback / Task Queue</div>
          ${b.macro.map(i => `<div class="item">${i}</div>`).join("")}</div>
      </div>`;
    } else if (b.kind === "flow") {
      inner = `<div class="flow">${b.nodes.map((n, i) =>
        `<span class="node ${n[1]}">${n[0]}</span>${i < b.nodes.length - 1 ? '<span class="arrow">→</span>' : ""}`
      ).join("")}</div>`;
    }
    return `<div class="diagram"><div class="dtitle">${b.dt}</div>${inner}</div>`;
  }
 
  function renderText(b) {
    return `<div class="block">${b.h ? `<h3>${b.h}</h3>` : ""}<div>${b.b}</div></div>`;
  }
 
  function renderNote(b) {
    const ico = { tip: "✓", warn: "!", key: "★" }[b.n] || "•";
    return `<div class="note ${b.n}"><span class="ico">${ico}</span><div>${b.b}</div></div>`;
  }
 
  function renderBlock(b) {
    switch (b.t) {
      case "code": return renderCode(b);
      case "diagram": return renderDiagram(b);
      case "note": return renderNote(b);
      default: return renderText(b);
    }
  }
 
  /* ---------- questions attached to episodes ---------- */
  // Each heavy topic maps to the episode(s) where it's taught, so the
  // full 15-question set surfaces under the most relevant episode.
  const EPISODE_TOPIC = {
    ep10: "closures", ep11: "closures", ep12: "closures",
    ep15: "eventloop", ep17: "eventloop",
    s2ep2: "promises", s2ep3: "promises", s2ep4: "promises", s2ep5: "promises",
    s2ep6: "this",
    ep19: "mapreduce", ep18: "mapreduce",
  };
 
  function questionsForEpisode(ep) {
    const topic = EPISODE_TOPIC[ep.id];
    if (!topic) return [];
    return QUESTIONS.filter(q => q.topic === topic).map(q => q.id);
  }
 
  function renderQuestion(qid, num) {
    const q = QUESTIONS.find(x => x.id === qid);
    if (!q) return "";
    const badge = q.diff === "hard" ? '<span class="q-badge hard">HARD</span>'
      : q.diff === "trick" ? '<span class="q-badge trick">TRICKY</span>'
        : '<span class="q-badge">CORE</span>';
    const prefix = num ? `<span class="q-num">${num}</span>` : "";
    return `<div class="q" data-q="${q.id}">
      <div class="q-head">${prefix}${badge}<div class="q-text">${q.q}</div><span class="q-toggle">+</span></div>
      <div class="q-body"><div class="q-body-inner">
        ${q.setup ? renderCode({ f: "question.js", c: q.setup }) : ""}
        <span class="ans-label">Answer</span>
        <p>${q.a}</p>
        ${q.fix ? renderCode({ f: "solution.js", c: q.fix }) : ""}
      </div></div>
    </div>`;
  }
 
  function escapeText(value) {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function renderGuide(id) {
    const guide = STUDY_GUIDES[id];
    const video = `https://www.youtube.com/watch?v=${guide.video}`;
    return `<div class="guide-intro"><a href="${video}" target="_blank" rel="noopener">Watch the lesson ↗</a>
      <p>Run examples separately unless a block explicitly continues the previous example. Predict its output before reading the explanation. Additional variations help you apply the concept.</p></div>
      <nav class="lesson-toc" aria-label="In this lesson"><b>In this lesson</b>${LESSON_VISUALS.locations[id] ? `<p><a href="#${id}-visual">Explore the interactive visual ↓</a></p>` : ''}<ol>${guide.sections.map((part,i) => `<li><a href="#${id}-part-${i}">${escapeText(part.title)}</a></li>`).join('')}</ol></nav>
      ${LESSON_VISUALS.render(id)}
      ${guide.sections.map((part,i) => `<section class="guide-section block" id="${id}-part-${i}"><h3>${escapeText(part.title)}</h3>
        ${part.time !== null ? `<a class="video-time" href="${video}&t=${part.time}s" target="_blank" rel="noopener">Video · ${Math.floor(part.time/60)}:${String(part.time%60).padStart(2,'0')} ↗</a>` : ''}
        ${part.body}${part.code ? renderCode({f:'example.js',c:escapeText(part.code)}) : ''}
        ${part.output ? `<div class="expected-output"><b>Expected result</b><pre>${escapeText(part.output)}</pre></div>` : ''}</section>`).join('')}
      <section class="recall"><h3>Check your understanding</h3><p>Explain your answer aloud, then open the explanation.</p>
        ${guide.recall.map(([q,a]) => `<details><summary>${escapeText(q)}</summary><p>${escapeText(a)}</p></details>`).join('')}</section>
      <p class="guide-reference">Further reading: ${(guide.references || [['MDN JavaScript Guide', 'https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide']]).map(([label, url]) => `<a href="${escapeText(url)}" target="_blank" rel="noopener">${escapeText(label)} ↗</a>`).join(' · ')}</p>`;
  }

  /* ---------- episode page ---------- */
  function renderEpisode(ep, idx) {
    const qs = questionsForEpisode(ep);
    const topicLabel = (TOPICS.find(t => t.key === EPISODE_TOPIC[ep.id]) || {}).label || "";
    const qsHtml = qs.length ? `<div class="qsec">
      <div class="qsec-title">⚡ ${qs.length} Interview Questions · ${topicLabel}</div>
      ${qs.map((id, i) => renderQuestion(id, i + 1)).join("")}
    </div>` : "";
 
    const prev = CONTENT[idx - 1];
    const next = CONTENT[idx + 1];
    const foot = `<div class="ep-foot">
      <button class="prev" ${prev ? `data-go="${prev.id}"` : "disabled"}>
        <span class="dir">← PREVIOUS</span><span>${prev ? prev.title : "—"}</span></button>
      <button class="next" ${next ? `data-go="${next.id}"` : "disabled"}>
        <span class="dir">NEXT →</span><span>${next ? next.title : "—"}</span></button>
    </div>`;
 
    return `<section class="episode visible" id="ep-${ep.id}">
      <div class="ep-head">
        <span class="tag">▪ ${ep.tag}</span>
        <h2>${ep.title}</h2>
        <div class="tldr">${STUDY_GUIDES[ep.id] ? "Read the explanation, predict the output, then try the variations and recall questions." : ep.tldr}</div>
      </div>
      ${STUDY_GUIDES[ep.id] ? renderGuide(ep.id) : ep.blocks.map(renderBlock).join("")}
      ${qsHtml}
      <button class="mark-done ${done.has(ep.id) ? "done" : ""}" data-done="${ep.id}">
        ${done.has(ep.id) ? "✓ Reviewed" : "Mark as reviewed"}</button>
      ${foot}
    </section>`;
  }
 
  /* ---------- home ---------- */
  function renderHome() {
    const lessons = CONTENT.filter(e => !e.special).length;
    return `<section class="episode visible">
      <div class="hero">
        <div class="eyebrow">Season 1 · Season 2 · Study & revision</div>
        <h1>${HERO.title}</h1>
        <p>${HERO.desc}</p>
        <div class="stats">
          <div class="stat"><div class="n">${CONTENT.length}</div><div class="l">Sections</div></div>
          <div class="stat"><div class="n">${lessons}</div><div class="l">Core Lessons</div></div>
          <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">Interview Qs</div></div>
          <div class="stat"><div class="n">${TOPICS.length}×15</div><div class="l">Per Topic</div></div>
        </div>
      </div>
      <div class="block" style="margin-top:40px">
        <h3>How to use this deck</h3>
        <p><a href="https://www.youtube.com/playlist?list=PLlasXeu85E9cQ32gLCvAvr9vNaUccPVNP" target="_blank" rel="noopener">Season 1 playlist ↗</a> · <a href="https://www.youtube.com/playlist?list=PLlasXeu85E9eWOpw9jxHOQyGMRiBZ60aX" target="_blank" rel="noopener">Season 2 playlist ↗</a> · <a href="https://www.youtube.com/watch?v=78Homn79Qsk" target="_blank" rel="noopener">Season 2 trailer ↗</a></p>
        <p>Work top-to-bottom through the sidebar, or jump to any weak spot. Both seasons have detailed explanations, video chapter links, worked examples, expected results, and recall exercises. The Season 2 bonus guide covers the nine JavaScript prerequisites for React. The interview questions include revealable answers. Mark sections <b>reviewed</b> to track your progress in the top bar.</p>
        <ul>
          <li><b>Season 1</b> builds the mental model: execution context, hoisting, scope, closures, the event loop, and functional methods.</li>
          <li><b>Season 2</b> covers callback hell, promises, async/await, promise APIs, and the <span class="kw">this</span> keyword.</li>
          <li>The <b>${QUESTIONS.length} interview questions</b> live in the <b>Question Bank</b> (⚡ in the sidebar): <b>15 each</b> for Closures, Event Loop, Promises &amp; async/await, <span class="kw">this</span>/call·bind·apply, and map/filter/reduce. The same sets also appear under their teaching episodes.</li>
        </ul>
      </div>
      <div class="note key"><span class="ico">★</span><div>Cramming? Jump straight to the <b>Question Bank</b> and drill one topic at a time — filter by <b>Hard</b> or <b>Tricky</b> to stress-test the edge cases. <button class="mark-done" data-go="bank" style="margin:10px 0 0;border-color:var(--amber);color:var(--amber-soft)">⚡ Open Question Bank</button></div></div>
      <div class="ep-foot">
        <button class="prev" disabled><span class="dir">← PREVIOUS</span><span>—</span></button>
        <button class="next" data-go="${CONTENT[0].id}"><span class="dir">START →</span><span>${CONTENT[0].title}</span></button>
      </div>
    </section>`;
  }
 
  /* ---------- question bank ---------- */
  let bankTopic = "closures";
  let bankDiff = "all";
 
  function renderBank() {
    const topicTabs = TOPICS.map(t => {
      const n = QUESTIONS.filter(q => q.topic === t.key).length;
      return `<button class="btab ${t.key === bankTopic ? "active" : ""}" data-topic="${t.key}">
        ${t.label}<span class="btab-n">${n}</span></button>`;
    }).join("");
 
    const diffTabs = ["all", "normal", "hard", "trick"].map(d => {
      const label = d === "all" ? "All" : d === "trick" ? "Tricky" : d[0].toUpperCase() + d.slice(1);
      return `<button class="dtab ${d === bankDiff ? "active" : ""}" data-diff="${d}">${label}</button>`;
    }).join("");
 
    const t = TOPICS.find(x => x.key === bankTopic);
    let list = QUESTIONS.filter(q => q.topic === bankTopic);
    if (bankDiff !== "all") list = list.filter(q => q.diff === bankDiff);
 
    const qHtml = list.length
      ? list.map((q, i) => renderQuestion(q.id, i + 1)).join("")
      : `<p style="color:var(--ink-faint);font-family:var(--mono);font-size:13px;padding:20px 0">No ${bankDiff} questions in this topic.</p>`;
 
    return `<section class="episode visible">
      <div class="ep-head">
        <span class="tag">▪ Drill Mode</span>
        <h2>Question Bank</h2>
        <div class="tldr">${QUESTIONS.length} interview questions across ${TOPICS.length} heavy topics — 15 each. Pick a topic, filter by difficulty, and tap any question to reveal the answer.</div>
      </div>
      <div class="bank-tabs">${topicTabs}</div>
      <div class="bank-sub">
        <div class="bank-hint">${t.hint}</div>
        <div class="diff-tabs">${diffTabs}</div>
      </div>
      <div class="bank-count">${list.length} question${list.length === 1 ? "" : "s"}</div>
      <div class="qsec" style="margin-top:8px">${qHtml}</div>
    </section>`;
  }
 
  /* ---------- navigation ---------- */
  function buildNav() {
    let html = `<div class="nav-group"><button class="nav-item" data-go="home">
      <span class="ep-num" style="border-color:var(--amber);color:var(--amber)">⌂</span>
      <span>Overview</span></button>
      <button class="nav-item" data-go="bank">
      <span class="ep-num" style="border-color:var(--green);color:var(--green)">⚡</span>
      <span>Question Bank</span><span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)">${QUESTIONS.length}</span></button></div>`;
    let lastGroup = null;
    CONTENT.forEach(ep => {
      if (ep.group !== lastGroup) {
        if (lastGroup !== null) html += `</div>`;
        html += `<div class="nav-group"><div class="nav-group-title">${ep.group}</div>`;
        lastGroup = ep.group;
      }
      html += `<button class="nav-item" data-go="${ep.id}">
        <span class="ep-num ${ep.special ? "special" : ""}">${ep.num}</span>
        <span>${ep.title}</span><span class="check">✓</span></button>`;
    });
    html += `</div>`;
    nav.innerHTML = html;
  }
 
  function updateProgress() {
    const total = CONTENT.filter(e => !e.special).length;
    const reviewed = [...done].filter(id => {
      const e = CONTENT.find(c => c.id === id);
      return e && !e.special;
    }).length;
    progFill.style.width = (reviewed / total * 100) + "%";
    progLabel.textContent = `${reviewed} / ${total} reviewed`;
  }
 
  function setActiveNav(id) {
    document.querySelectorAll(".nav-item").forEach(el => {
      const go = el.getAttribute("data-go");
      el.classList.toggle("active", go === id);
      const ep = CONTENT.find(c => c.id === go);
      if (ep) el.classList.toggle("done", done.has(go));
    });
  }
 
  function go(id) {
    current = id;
    if (id === "home") {
      main.innerHTML = renderHome();
    } else if (id === "bank") {
      main.innerHTML = renderBank();
    } else {
      const idx = CONTENT.findIndex(e => e.id === id);
      main.innerHTML = renderEpisode(CONTENT[idx], idx);
    }
    setActiveNav(id);
    updateProgress();
    window.scrollTo({ top: 0, behavior: "auto" });
    closeSidebar();
  }
 
  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const topicEl = e.target.closest("[data-topic]");
    if (topicEl) { bankTopic = topicEl.getAttribute("data-topic"); bankDiff = "all"; main.innerHTML = renderBank(); window.scrollTo({ top: 0 }); return; }
 
    const diffEl = e.target.closest("[data-diff]");
    if (diffEl) { bankDiff = diffEl.getAttribute("data-diff"); main.innerHTML = renderBank(); return; }
 
    const goEl = e.target.closest("[data-go]");
    if (goEl && !goEl.disabled) { go(goEl.getAttribute("data-go")); return; }
 
    const doneEl = e.target.closest("[data-done]");
    if (doneEl) {
      const id = doneEl.getAttribute("data-done");
      if (done.has(id)) { done.delete(id); doneEl.classList.remove("done"); doneEl.textContent = "Mark as reviewed"; }
      else { done.add(id); doneEl.classList.add("done"); doneEl.textContent = "✓ Reviewed"; }
      setActiveNav(current);
      updateProgress();
      return;
    }
 
    const qHead = e.target.closest(".q-head");
    if (qHead) {
      const q = qHead.closest(".q");
      const body = q.querySelector(".q-body");
      const open = q.classList.toggle("open");
      body.style.maxHeight = open ? body.scrollHeight + "px" : "0";
      // recalc on open in case nested code changed height
      if (open) setTimeout(() => { body.style.maxHeight = body.scrollHeight + "px"; }, 40);
    }
  });
 
  /* ---------- mobile sidebar ---------- */
  function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("show"); }
  function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("show"); }
  menuBtn.addEventListener("click", () => sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
  overlay.addEventListener("click", closeSidebar);
 
  /* ---------- keyboard nav ---------- */
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, button, [data-visual]")) return;
    const ids = ["home", ...CONTENT.map(c => c.id)];
    const i = ids.indexOf(current);
    if (e.key === "ArrowRight" && i < ids.length - 1) go(ids[i + 1]);
    if (e.key === "ArrowLeft" && i > 0) go(ids[i - 1]);
  });
 
  /* ---------- theme toggle (in-memory) ---------- */
  const themeToggle = document.getElementById("themeToggle");
  let dark = false;
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const icon = themeToggle.querySelector(".tt-icon");
    if (icon) icon.textContent = dark ? "☾" : "☀";
  }
  themeToggle.addEventListener("click", () => { dark = !dark; applyTheme(); });
  applyTheme();
 
  /* ---------- init ---------- */
  buildNav();
  go("home");
})();
 
</script>
</body>
</html>
